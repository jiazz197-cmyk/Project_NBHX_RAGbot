# ragchain 独立容器（宿主 8010 → 容器 8000）
# 构建：docker compose -f ragchain/compose.yaml build
# 启动：docker compose -f ragchain/compose.yaml up -d
services:
  ragchain:
    image: nbhx-ragchain:py312
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYPI_INDEX: ${PYPI_INDEX:-https://mirrors.aliyun.com/pypi/simple}
      provenance: false
      sbom: false
    ports:
      - "8010:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

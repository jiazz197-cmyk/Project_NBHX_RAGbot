# 主应用根 pytest 配置。
# ragchain/ 是独立容器的独立包（有自己的 pytest.ini / requirements），其
# tests 不能由主应用 pytest 收集：工作目录不同会导致 `app` 包解析成主应用。
# CI 的 `pytest -q` 与本地 `bash scripts/dev.sh docker test` 都只看 tests/。
[pytest]
testpaths = tests
norecursedirs = ragchain .git .github .cache .venv venv node_modules frontend docs scripts
